[project]
name = "backfills"
version = "0.0.0"
description = "Schema-change backfills for acme, run as the admin backfill job."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "control-plane",
    "typer>=0.15.0",
]

[tool.uv.sources]
control-plane = { path = "../control-plane" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backfills"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
backfill = "backfills.cli:app"
