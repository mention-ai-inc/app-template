name: Deployment
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Deploy notes service"
        type: boolean
        default: false
      terraform_operations:
        description: "Deploy operations terraform"
        type: boolean
        default: false
      web:
        description: "Deploy web app"
        type: boolean
        default: false
      mcp:
        description: "Deploy MCP"
        type: boolean
        default: false
      admin:
        description: "Deploy admin API"
        type: boolean
        default: false
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: deployment-${{ github.event_name == 'pull_request' && 'demo' || 'production' }}
  cancel-in-progress: false

env:
  LAST_DEPLOYED_TAG: demo-deployed

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read enabled surfaces
        id: project
        run: python3 infrastructure/cli/_helpers/project_setup.py settings --github >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Initialize environment
        run: make -f infrastructure/cli/Makefile init

      - name: Deploy terraform operations changes
        if: github.event_name == 'workflow_dispatch' && inputs.terraform_operations
        run: make -f infrastructure/cli/Makefile terraform-operations

      - name: Deploy terraform services changes to demo
        if: github.event_name == 'pull_request'
        run: make -f infrastructure/cli/Makefile terraform-services
        env:
          FEATURE_ENVIRONMENT: demo

      - name: Deploy terraform MCP changes to demo
        if: github.event_name == 'pull_request' && steps.project.outputs.mcp == 'true'
        run: make -f infrastructure/cli/Makefile terraform-mcp
        env:
          FEATURE_ENVIRONMENT: demo

      - name: Deploy terraform admin changes to demo
        if: github.event_name == 'pull_request' && steps.project.outputs.admin == 'true'
        run: make -f infrastructure/cli/Makefile terraform-admin
        env:
          FEATURE_ENVIRONMENT: demo

      - name: Deploy changed services to demo
        if: github.event_name == 'pull_request'
        run: make -f infrastructure/cli/Makefile deploy-changes
        env:
          FEATURE_ENVIRONMENT: demo
          DEPLOY_COMPARE_TO: last-deployed

      - name: Deploy web app to demo
        if: github.event_name == 'pull_request' && steps.project.outputs.web == 'true'
        run: make -f infrastructure/cli/Makefile deploy-web
        env:
          FEATURE_ENVIRONMENT: demo

      - name: Record the demo deploy baseline
        if: github.event_name == 'pull_request'
        run: |
          git tag -f ${{ env.LAST_DEPLOYED_TAG }} ${{ github.event.pull_request.merge_commit_sha }}
          git push -f origin refs/tags/${{ env.LAST_DEPLOYED_TAG }}

      - name: Deploy terraform services changes to production
        if: github.event_name == 'workflow_dispatch'
        run: make -f infrastructure/cli/Makefile terraform-services

      - name: Deploy terraform MCP changes to production
        if: github.event_name == 'workflow_dispatch' && inputs.mcp && steps.project.outputs.mcp == 'true'
        run: make -f infrastructure/cli/Makefile terraform-mcp

      - name: Deploy services to production
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_NOTES: ${{ inputs.notes }}
        run: |
          if [ "$DEPLOY_NOTES" = "true" ]; then make -f infrastructure/cli/Makefile deploy-notes; fi

      - name: Deploy web app to production
        if: github.event_name == 'workflow_dispatch' && inputs.web && steps.project.outputs.web == 'true'
        run: make -f infrastructure/cli/Makefile deploy-web

      - name: Deploy terraform admin changes to production
        if: github.event_name == 'workflow_dispatch' && inputs.admin && steps.project.outputs.admin == 'true'
        run: make -f infrastructure/cli/Makefile terraform-admin

      - name: Deploy mcp to production
        if: github.event_name == 'workflow_dispatch' && inputs.mcp && steps.project.outputs.mcp == 'true'
        run: make -f infrastructure/cli/Makefile deploy-mcp

      - name: Deploy admin API to production
        if: github.event_name == 'workflow_dispatch' && inputs.admin && steps.project.outputs.admin == 'true'
        run: make -f infrastructure/cli/Makefile deploy-admin
