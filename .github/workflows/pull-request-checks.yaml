name: Pull Request Checks
run-name: ${{ github.ref_name }} PR Checks
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Initialize environment
        run: make -f infrastructure/cli/Makefile init

      - name: Run code checks
        run: make -f infrastructure/cli/Makefile run-checks

  vulnerability-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --config=osv-scanner.toml
            -r
            .
