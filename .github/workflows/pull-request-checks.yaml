name: Pull Request Checks
run-name: ${{ github.ref_name }} PR Checks
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Initialize environment
        run: make -f infrastructure/cli/Makefile init

      - name: Run code checks
        run: make -f infrastructure/cli/Makefile run-checks

  vulnerability-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --config=osv-scanner.toml
            -r
            .

  run-backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # required for the get-changed that runs when determining which tests to run
          ref: ${{ github.head_ref }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Initialize environment
        run: make -f infrastructure/cli/Makefile init

      - name: Run backend tests
        run: make -f infrastructure/cli/Makefile run-tests-backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  update-feature-environment:
    if: (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'needs-feature-environment'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Ensure feature environment exists
        id: ensure-env
        continue-on-error: true
        run: make -f infrastructure/cli/Makefile ensure-feature-environment

      - name: Initialize environment
        run: make -f infrastructure/cli/Makefile init

      - name: Update feature environment
        if: steps.ensure-env.outcome == 'success'
        run: make -f infrastructure/cli/Makefile create-feature-environment
