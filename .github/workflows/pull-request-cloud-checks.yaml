name: Pull Request Cloud Checks
run-name: ${{ github.ref_name }} PR Cloud Checks
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
jobs:
  run-backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          role-session-name: pull-request-cloud-checks
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize environment
        run: make -f infrastructure/cli/Makefile init

      - name: Run backend tests
        run: make -f infrastructure/cli/Makefile run-tests-backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  update-feature-environment:
    if: (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'needs-feature-environment'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          role-session-name: update-feature-environment
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true

      - name: Ensure feature environment exists
        id: ensure-env
        continue-on-error: true
        run: make -f infrastructure/cli/Makefile ensure-feature-environment

      - name: Initialize environment
        run: make -f infrastructure/cli/Makefile init

      - name: Update feature environment
        if: steps.ensure-env.outcome == 'success'
        run: make -f infrastructure/cli/Makefile create-feature-environment
