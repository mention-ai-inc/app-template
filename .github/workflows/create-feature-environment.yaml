name: Create Feature Environment
on:
  issues:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      name:
        description: Name of the new feature environment. A branch will also be created with this name.
        required: true

concurrency:
  group: feature-environment-${{ github.event_name == 'workflow_dispatch' && inputs.name || format('issue-{0}', github.event.issue.number) }}
  cancel-in-progress: false

jobs:
  create-environment:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'needs-feature-environment'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Sync feature branch to default branch
        env:
          FEATURE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.name || format('issue-{0}', github.event.issue.number) }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git push origin "FETCH_HEAD:refs/heads/$FEATURE_BRANCH" --force

      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.name || format('issue-{0}', github.event.issue.number) }}

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          role-session-name: create-feature-environment
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true

      - name: Initialize environment
        run: make -f infrastructure/cli/Makefile init

      - name: Create feature environment
        run: make -f infrastructure/cli/Makefile create-feature-environment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
