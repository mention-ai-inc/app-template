[project]
name = "library-provider-azure"
version = "0.0.0"
description = "Microsoft Azure data-plane adapters for the acme shared kernel."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "aiohttp>=3.11.0",
    "azure-cosmos>=4.9.0",
    "azure-identity>=1.19.0",
    "azure-keyvault-keys>=4.10.0",
    "azure-keyvault-secrets>=4.9.0",
    "azure-servicebus>=7.13.0",
    "azure-storage-blob>=12.24.0",
    "library",
]

[project.entry-points."acme.cloud_provider"]
azure = "library_provider_azure.provider:PROVIDER"

[tool.uv.sources]
library = { path = "../.." }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.3",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::SyntaxWarning",
    "ignore:pkg_resources is deprecated:UserWarning",
]
testpaths = ["tests"]
pythonpath = ["../.."]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["library_provider_azure"]
