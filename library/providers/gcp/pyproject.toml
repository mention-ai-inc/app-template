[project]
name = "library-provider-gcp"
version = "0.0.0"
description = "Google Cloud data-plane adapters for the acme shared kernel."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "google-auth>=2.48.0",
    "cloudevents>=2.0.0",
    "google-api-core",
    "google-cloud-firestore>=2.23.0",
    "google-events>=0.14.0",
    "library",
]

[project.entry-points."acme.cloud_provider"]
gcp = "library_provider_gcp.provider:PROVIDER"

[tool.uv.sources]
library = { path = "../.." }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.3",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::SyntaxWarning",
    "ignore:pkg_resources is deprecated:UserWarning",
]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["library_provider_gcp"]
