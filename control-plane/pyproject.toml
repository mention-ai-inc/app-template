[project]
name = "control-plane"
version = "0.0.0"
description = "Language-neutral control plane for acme: ports, domain primitives, audit, API scaffolding, provider registry, and the local provider."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "cryptography>=50.0.0",
    "fastapi>=0.134.0",
    "gunicorn>=25.1.0",
    "httpx>=0.28.1",
    "logfire>=4.32.1",
    "pydantic>=2.12.5",
    "pyjwt>=2.13.0",
    "redis>=7.2.1",
    "sentry-sdk[fastapi]>=2.53.0",
    "uvicorn>=0.41.0",
    "uvicorn-worker>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.3",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::SyntaxWarning",
    "ignore:pkg_resources is deprecated:UserWarning",
]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["control_plane"]
