[project]
name = "control-plane-provider-aws"
version = "0.0.0"
description = "Amazon Web Services data-plane adapters for the acme shared kernel."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "aioboto3>=15.5.0",
    "boto3>=1.40.46",
    "control-plane",
]

[project.entry-points."acme.cloud_provider"]
aws = "control_plane_provider_aws.provider:PROVIDER"

[tool.uv.sources]
control-plane = { path = "../.." }

[dependency-groups]
dev = [
    "moto[server]>=5.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.3",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::SyntaxWarning",
    "ignore:pkg_resources is deprecated:UserWarning",
]
testpaths = ["tests"]
pythonpath = ["../.."]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["control_plane_provider_aws"]
